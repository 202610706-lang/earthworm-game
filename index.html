<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잔디밭 스네이크 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <!-- 좌측 상단: 스코어보드 -->
    <div id="scoreboard" class="scoreboard">
      <div class="score-line">
        <span class="icon-worm"></span>
        <span class="label">이번 판 점수:</span> <span id="currentScore" class="value">0</span>
      </div>
      <div class="score-line">
        <span class="icon-apple">🍎</span>
        <span class="label">역대 최고 점수:</span> <span id="highScore" class="value">0</span>
      </div>
    </div>

    <!-- 우측 상단: 게임 조작 버튼 -->
    <div class="top-controls">
      <button id="topStartBtn" class="control-btn">🎮 새 게임 시작</button>
      <button id="topPauseBtn" class="control-btn" disabled>⏸️ 일시정지</button>
    </div>

    <!-- 메인 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 하단 중앙: 조작 안내 -->
    <div class="controls-info">
      조작법: 방향키 (<span class="key">▲</span>, <span class="key">▼</span>, <span class="key">◀</span>, <span class="key">▶</span>) | 일시정지: Spacebar
    </div>

    <!-- UI 오버레이 -->
    <div id="overlay" class="overlay">
      <h1 id="overlayTitle">잔디밭 스네이크</h1>
      <p id="overlayMessage">시작 버튼을 누르면 시작됩니다!</p>
      <div id="finalScoreContainer" class="final-score-box hidden">
        <span>내가 이번 한 게임에서 낸 점수: </span>
        <strong id="finalScore">0</strong>점
      </div>
      <button id="centerStartBtn">게임 시작</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
